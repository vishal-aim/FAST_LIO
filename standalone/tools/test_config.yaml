# Paired with gen_test_mcap's synthetic output -- same shape as
# config/velodyne.yaml but with a couple of fields tuned to match the
# generator's synthetic data (timestamp_unit: 0 since its point .time field
# is in seconds, not microseconds like a real Velodyne driver; a tighter
# cube_side_length/det_range since the synthetic scene is only ~10m across).
common:
    lid_topic:  "/velodyne_points"
    imu_topic:  "/imu/data"
    time_offset_lidar_to_imu: 0.0

preprocess:
    lidar_type: 2                # VELO16
    scan_line: 32
    scan_rate: 5
    timestamp_unit: 0            # SEC -- matches gen_test_mcap's point .time field
    blind: 0.5

mapping:
    acc_cov: 0.1
    gyr_cov: 0.1
    b_acc_cov: 0.0001
    b_gyr_cov: 0.0001
    det_range: 50.0
    extrinsic_est_en: false
    extrinsic_T: [ 0, 0, 0 ]
    extrinsic_R: [ 1, 0, 0,
                   0, 1, 0,
                   0, 0, 1 ]

cube_side_length: 50
filter_size_surf: 0.3
filter_size_map: 0.3
