# For the real ROS2 rosbag2 (.db3) Ouster recording -- topics/lidar_type/
# timestamp_unit match config/ouster64.yaml's conventions for a real Ouster
# driver (PointField "t" in nanoseconds since scan start).
common:
    lid_topic:  "/ouster/points"
    imu_topic:  "/ouster/imu"
    time_offset_lidar_to_imu: 0.0

preprocess:
    lidar_type: 3                # OUST64
    scan_line: 32
    timestamp_unit: 3            # NS
    blind: 1

mapping:
    acc_cov: 0.1
    gyr_cov: 0.1
    b_acc_cov: 0.0001
    b_gyr_cov: 0.0001
    det_range: 100.0
    extrinsic_est_en: false
    extrinsic_T: [ 0, 0, 0 ]
    extrinsic_R: [ 1, 0, 0,
                   0, 1, 0,
                   0, 0, 1 ]

point_filter_num: 3
