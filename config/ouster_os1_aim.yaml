/**:
    ros__parameters:
        feature_extract_enable: false
        point_filter_num: 3
        max_iteration: 3
        filter_size_surf: 0.5
        filter_size_map: 0.5
        cube_side_length: 1000.0
        runtime_pos_log_enable: false
        map_file_path: "./test.pcd"

        common:
            lid_topic:  "/ouster/points"
            imu_topic:  "/ouster/imu"
            time_sync_en: false          # lidar and IMU share the sensor clock
            time_offset_lidar_to_imu: 0.0

        preprocess:
            lidar_type: 3                # 3 = ouster
            scan_line: 128               # OS-1-128
            timestamp_unit: 3            # per-point t is in nanoseconds
            blind: 1.0                   # sensor min range is 0.5 m; keep close excavator structure out

        mapping:
            acc_cov: 0.1
            gyr_cov: 0.1
            b_acc_cov: 0.0001
            b_gyr_cov: 0.0001
            fov_degree:    360.0
            det_range:     150.0
            extrinsic_est_en:  false
            # Extrinsic translation ignored as requested (using [0, 0, 0])
            extrinsic_T: [ 0.0, 0.0, 0.0 ]
            extrinsic_R: [1., 0., 0.,
                          0., 1., 0.,
                          0., 0., 1.]

        publish:
            path_en:  true
            scan_publish_en:  true
            dense_publish_en: true
            scan_bodyframe_pub_en: true

        pcd_save:
            pcd_save_en: true
            interval: -1                 # accumulate everything into one scans.pcd on exit
